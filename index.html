<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Knight Re:BIRTH Code</title>
<meta name="description" content="เว็บรวมโค้ด Seven Knights Re:Birth กรอก UID ครั้งเดียว ใช้ได้ทุกโค้ด">

<!-- Favicon -->
<link rel="icon" type="image/png" href="skre.png">

<!-- Open Graph (Discord / Facebook / LINE) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Seven Knights Re:BIRTH Code">
<meta property="og:description" content="เว็บรวมโค้ด Seven Knights Re:BIRTH สำหรับกรอกโค้ดอัตโนมัติ จำ UID และโค้ดที่ใช้แล้ว">
<meta property="og:image" content="https://bearcarrot.github.io/7k-redeem/skre.png">
<meta property="og:url" content="https://bearcarrot.github.io/7k-redeem/">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Seven Knights Re:Birth Redeem">
<meta name="twitter:description" content="เว็บรวมโค้ด Seven Knights Re:BIRTH สำหรับกรอกโค้ดอัตโนมัติ ใช้ง่าย รองรับมือถือ">
<meta name="twitter:image" content="https://bearcarrot.github.io/7k-redeem/skre.png">

<!-- Theme color (Discord / Mobile) -->
<meta name="theme-color" content="#1a0709">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<main class="wrap">

  <header class="masthead">
    <img src="skre.png" class="logo" alt="Seven Knights Re:BIRTH" width="96" height="96">
    <h1>Seven Knight Re:BIRTH Code</h1>
    <p class="sub">รวมโค้ดรับของฟรี ใส่ UID ครั้งเดียว กดรับได้ทุกโค้ด</p>
  </header>

  <section class="uid-panel" aria-labelledby="uidLabel">
    <label id="uidLabel" for="pid">UID</label>
    <input type="text" id="pid" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" placeholder="วาง UID 32 ตัวอักษร" aria-describedby="pidHint pidError">
    <p id="pidError" class="field-error" role="alert" hidden></p>
    <p id="pidHint" class="hint"></p>
  </section>

  <div class="list-head">
    <h2>โค้ดที่ใช้ได้ตอนนี้ <span id="count" class="count"></span></h2>
    <button type="button" id="redeemAll" class="btn-ghost" hidden>รับทั้งหมด</button>
  </div>

  <div id="codeList" class="codes" aria-live="polite" aria-busy="true"></div>

</main>

<footer class="credit">
  Created by <a href="https://discord.gg/2BfdyUUcbH" target="_blank" rel="noopener">Bearcarrot</a>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
